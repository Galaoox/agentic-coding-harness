name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -q
      - run: uv run python scripts/validate_knowledge_base.py
      - run: uv run python scripts/validate_harness_packages.py
      - run: uv run python scripts/validate_codex_package.py
      - run: uv run python scripts/report_context_budget.py
      - run: >-
          uv run python -m py_compile
          scripts/validate_knowledge_base.py
          scripts/validate_harness_packages.py
          scripts/validate_codex_package.py
          scripts/report_context_budget.py
          scripts/run_opencode_smoke.py
          scripts/run_codex_smoke.py
          scripts/smoke_evidence.py
          scripts/prepare_smoke_fixture.py
          packages/opencode/install/install.py
          packages/opencode/install/verify_install.py
      - name: Check committed diff hygiene
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          else
            git diff --check "${{ github.event.before }}...${{ github.sha }}"
          fi
